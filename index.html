<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nguyen Trung Hau - Frontend Developer Intern Portfolio. View my resume, skills, and projects." />
    <meta name="keywords" content="Nguyen Trung Hau, Frontend Developer, ReactJS, Portfolio, Web Developer" />
    <meta property="og:title" content="Nguyen Trung Hau | Frontend Developer" />

    <meta property="og:type" content="website" />
    <title>Nguyen Trung Hau | Frontend Developer</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && systemDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
